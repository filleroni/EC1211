<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EC1211 Makroekonomi</title>
  <link rel="stylesheet" href="assets/vendor/katex.min.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">EC1211 <span>Makroekonomi</span></a>
    <nav>
      <a href="#/">Föreläsningar</a>
      <a href="#/quiz">Skapa quiz</a>
      <a href="#/begrepp">Begrepp & formler</a>
      <a href="#/duggor">Duggor</a>
    </nav>
  </header>
  <main id="app"><p class="muted">Laddar föreläsningar…</p></main>
  <footer class="foot">EC1211 Makroekonomi med tillämpningar</footer>

  <script>
    // Visas bara om sidans filer inte går att läsa in (t.ex. om index.html öppnas direkt ur en zip-fil).
    setTimeout(function () {
      var app = document.getElementById("app");
      if (app && !app.dataset.ready) app.innerHTML = '<div class="card"><b>Sidan kunde inte laddas.</b><p>Om du öppnade index.html direkt i en zip-fil: packa upp hela mappen först och öppna index.html i den uppackade mappen. Annars kan du använda webbadressen: <a href="https://filleroni.github.io/EC1211/">filleroni.github.io/EC1211</a>.</p></div>';
    }, 6000);
  </script>
  <script src="assets/vendor/marked.min.js"></script>
  <script src="assets/vendor/katex.min.js"></script>
  <script src="assets/vendor/auto-render.min.js"></script>
  <script>
    // Hämta alltid färska versioner (GitHub Pages cachar annars filerna i upp till 10 minuter).
    window.CACHE_BUST = "?v=" + Date.now();
    ["lectures/manifest.js", "assets/graphs.js", "assets/quiz.js", "assets/drill.js", "assets/app.js"].forEach(function (src) {
      var s = document.createElement("script");
      s.src = src + window.CACHE_BUST;
      s.async = false; // behåll ordningen
      document.body.appendChild(s);
    });
  </script>
</body>
</html>
